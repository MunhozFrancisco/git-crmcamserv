version: '3.9'

services:
  app:
    image: camserv-crm-dev:latest
    container_name: camserv-crm-dev
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.dev
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3002/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
